<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel de aulas · Prof. Wilton · FPP</title>
<meta name="theme-color" content="#005CA0">
<style>
@font-face{font-family:Montserrat;font-weight:400;src:url(../assets/fonts/montserrat-400.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:500;src:url(../assets/fonts/montserrat-500.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:700;src:url(../assets/fonts/montserrat-700.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:800;src:url(../assets/fonts/montserrat-800.woff2) format("woff2")}
:root{--azul:#005CA0;--azul-esc:#034578;--amar:#FFDD09;--azul-cl:#e6f0f8;--tinta:#1a1a1a;--cinza:#6b7280;--linha:#d9e1ea}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;color:var(--tinta);background:#fff}
header{background:var(--azul);color:#fff;padding:22px 0 24px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
header img{height:36px}
header .onde{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--amar)}
h1{margin:0;font-size:clamp(28px,4.6vw,44px);font-weight:800;text-transform:uppercase;line-height:1.05}
h1 span{background:var(--amar);color:var(--azul);padding:0 .14em}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.ctl input{font:inherit;font-size:16px;padding:10px 14px;border:0;min-width:240px;flex:1;max-width:420px}
.chip{font:inherit;font-size:14px;font-weight:700;padding:9px 14px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer}
.chip.on{background:#fff;color:var(--azul)}
main{max-width:1080px;margin:0 auto;padding:6px 24px 50px}
h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--azul);font-weight:800;margin:30px 0 0;padding-top:10px;border-top:4px solid var(--azul)}
.aula{display:grid;grid-template-columns:92px 1fr auto;gap:22px;align-items:center;padding:20px 0;border-bottom:1px solid var(--linha)}
.data{width:92px;height:92px;background:var(--azul-cl);color:var(--azul);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1;text-align:center}
.data .d{font-size:30px}.data .m{font-size:13px;letter-spacing:.1em;text-transform:uppercase}.data .w{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.8}
.data.prox{background:var(--amar)}
.data.sem{background:#f3f5f8;color:var(--cinza);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.info .t{font-size:21px;font-weight:800;color:var(--azul);line-height:1.2}
.info .s{font-size:14px;color:var(--cinza);margin-top:4px}
.info .n{font-size:13px;color:var(--tinta);margin-top:6px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;margin-right:6px;background:var(--azul-cl);color:var(--azul-esc)}
.tag.am{background:var(--amar);color:var(--azul)}
.acoes{display:flex;flex-direction:column;gap:8px;width:270px}
.btn{display:flex;align-items:center;justify-content:center;font:inherit;font-weight:700;font-size:15px;padding:12px 16px;text-decoration:none;border:2px solid var(--azul);background:#fff;color:var(--azul);cursor:pointer;text-align:center}
.btn.pri{background:var(--azul);color:#fff}
.btn.am{background:var(--amar);border-color:var(--amar);color:var(--azul)}
.btn[aria-disabled=true]{border-color:var(--linha);color:var(--cinza);cursor:default;background:#fafbfc}
.lin{display:flex;gap:8px}.lin .btn{flex:1;font-size:13px;padding:9px 8px}
.vazio{color:var(--cinza);padding:30px 0}
footer{max-width:1080px;margin:0 auto;padding:18px 24px 40px;border-top:1px solid var(--linha);font-size:13px;color:var(--cinza);display:flex;justify-content:space-between;gap:20px;align-items:center}
footer img{height:28px}
#qr{position:fixed;inset:0;background:rgba(3,69,120,.96);display:none;align-items:center;justify-content:center;gap:50px;color:#fff;padding:30px;z-index:5;cursor:pointer;flex-wrap:wrap}
#qr.show{display:flex}#qr svg{width:min(70vh,80vw);height:min(70vh,80vw)}
#qr .tx{font-size:28px;font-weight:800;max-width:420px}#qr .tx small{display:block;font-size:16px;font-weight:500;color:#dce9f5;margin-top:14px;word-break:break-all}
@media(max-width:720px){.aula{grid-template-columns:70px 1fr}.data{width:70px;height:70px}.data .d{font-size:22px}.acoes{grid-column:1/-1;width:auto}}
</style>
</head><body>
<header><div class="wrap">
  <div class="top"><img src="../assets/img/fpp-logo-branco.png" alt="Faculdades Pequeno Príncipe"><span class="onde" id="onde"></span></div>
  <h1>Painel de <span>aulas</span></h1>
  <div class="ctl"><input id="busca" type="search" placeholder="Buscar aula, tema ou turma…" autocomplete="off"><span id="chips" style="display:contents"></span></div>
</div></header>
<main id="lista"></main>
<footer><span id="rodape"></span><img src="../assets/img/fpp-logo-azul.png" alt="FPP"></footer>
<div id="qr" title="Clique para fechar"></div>
<script>/*QRCODE*/</script>
<script>
const AULAS=/*AULAS*/[], SITE=/*SITE*/'', LOCAL=/*LOCAL*/false;
const $=s=>document.querySelector(s);
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const hoje=new Date();hoje.setHours(0,0,0,0);
let filtro='Todas';
$('#onde').textContent=LOCAL?'Versão do Mac · abre também os arquivos offline':'Versão web';
$('#rodape').innerHTML=LOCAL?`Versão online: <a href="${SITE}painel/" style="color:inherit">${SITE.replace('https://','')}painel/</a>`:'Abra no computador da sala e clique em “Apresentar”.';
function qrSvg(t){const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount();let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+2} ${r+2}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+4} ${n+4}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#034578"/></svg>`}
function mostraQR(url,tit){$('#qr').innerHTML=qrSvg(url)+`<div class="tx">${tit}<small>${url.replace('https://','')}</small></div>`;$('#qr').classList.add('show')}
$('#qr').onclick=()=>$('#qr').classList.remove('show');
addEventListener('keydown',e=>{if(e.key==='Escape')$('#qr').classList.remove('show')});
function dt(s){if(!s)return null;const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)}
function bloco(a){const d=dt(a.proxima);
  if(!d)return `<div class="data sem">sem<br>data</div>`;
  const fut=d>=hoje;return `<div class="data ${fut?'prox':''}"><span class="w">${SEM[d.getDay()]}</span><span class="d">${String(d.getDate()).padStart(2,'0')}</span><span class="m">${MES[d.getMonth()]}</span></div>`}
function acoes(a){const b=[];const w=a.web?SITE+a.web:'';
  if(w&&a.ao_vivo)b.push(`<a class="btn pri" href="${w}aula.html?ao-vivo" target="_blank">▶ Apresentar ao vivo</a>`);
  else if(w)b.push(`<a class="btn pri" href="${w}aula.html" target="_blank">▶ Apresentar</a>`);
  if(LOCAL&&a.local_url)b.push(`<a class="btn ${w?'':'pri'}" href="${a.local_url}">${a.formato==='pptx'?'Abrir PowerPoint':(w?'Offline (sem internet)':'▶ Apresentar (arquivo do Mac)')}</a>`);
  else if(!w&&a.local)b.push(`<span class="btn" aria-disabled="true">Arquivo no Mac · abra o painel do Desktop</span>`);
  if(w)b.push(`<div class="lin"><a class="btn" href="${w}" target="_blank">Página dos alunos</a><button class="btn" data-qr="${w}" data-t="${a.titulo.replace(/"/g,'&quot;')}">QR</button></div>`);
  return b.join('')}
function render(){
  const q=$('#busca').value.trim().toLowerCase();
  const vis=AULAS.filter(a=>(filtro==='Todas'||a.turma===filtro)&&(!q||(a.titulo+' '+a.turma+' '+a.uc+' '+a.nota).toLowerCase().includes(q)));
  const futuras=vis.filter(a=>dt(a.proxima)&&dt(a.proxima)>=hoje).sort((x,y)=>dt(x.proxima)-dt(y.proxima));
  const outras=vis.filter(a=>!futuras.includes(a)).sort((x,y)=>x.titulo.localeCompare(y.titulo,'pt'));
  const linha=a=>`<div class="aula">${bloco(a)}<div class="info"><div class="t">${a.titulo}</div><div class="s">${a.turma} · ${a.uc}</div><div class="n">${a.ao_vivo?'<span class="tag am">votação ao vivo</span>':''}${a.web?'<span class="tag">na web</span>':''}${a.formato==='pptx'?'<span class="tag">pptx</span>':''}${a.nota||''}</div></div><div class="acoes">${acoes(a)}</div></div>`;
  $('#lista').innerHTML=(futuras.length?`<h2>Próximas</h2>${futuras.map(linha).join('')}`:'')+(outras.length?`<h2>Todas as aulas</h2>${outras.map(linha).join('')}`:'')+(vis.length?'':'<p class="vazio">Nenhuma aula encontrada.</p>');
  document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>mostraQR(b.dataset.qr,'Material da aula<br>'+b.dataset.t));
}
const turmas=['Todas',...[...new Set(AULAS.map(a=>a.turma))].sort()];
$('#chips').innerHTML=turmas.map(t=>`<button class="chip ${t===filtro?'on':''}">${t}</button>`).join('');
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filtro=c.textContent;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));render()});
$('#busca').oninput=render;render();
</script>
</body></html>
